<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root { color-scheme: light; font: 14px/1.45 system-ui, sans-serif; color: #26384d; }
      body { margin: 0; padding: 10px; background: #fff; }
      .grid { display: grid; gap: 10px; }
      label { font-weight: 650; }
      input[type=file] { display: block; width: 100%; margin: 6px 0; }
      video, canvas { width: 100%; max-height: 245px; background: #121923; object-fit: contain; border-radius: 8px; }
      button { padding: 9px 13px; border: 0; border-radius: 7px; background: #092759; color: white; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .status { min-height: 20px; color: #586c82; }
      .note { margin: 4px 0; color: #68798c; font-size: 12px; }
      .error { color: #b42332; }
      .success { color: #087443; }
    </style>
  </head>
  <body>
    <div class="grid">
      <label for="card-file">Foto kartu pegawai (bagian depan)</label>
      <input id="card-file" type="file" accept="image/*">
      <label>Selfie bersama kartu</label>
      <video id="camera" autoplay muted playsinline></video>
      <canvas id="capture" hidden></canvas>
      <div class="actions">
        <button id="start-camera" type="button">Nyalakan kamera</button>
        <button id="capture-photo" type="button" disabled>Ambil selfie + kartu</button>
        <button id="verify" type="button" disabled>Verifikasi di browser</button>
      </div>
      <div class="status" id="status">Pilih foto kartu dan ambil selfie.</div>
      <p class="note">Dekatkan kartu ke kamera, pastikan wajah dan seluruh nomor fokus, serta hindari pantulan. Foto diproses lokal di browser; hanya hasil cocok/tidak cocok yang dikirim ke Streamlit.</p>
    </div>
    <script src="./face-api.min.js"></script>
    <script src="./tesseract.min.js"></script>
    <script src="./component.js"></script>
  </body>
</html>
